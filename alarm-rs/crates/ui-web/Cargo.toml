[package]
name = "ui-web"
description = "The client view: Leptos (CSR) compiled to WASM, shown in the Tauri WebView"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol = { workspace = true }
domain = { workspace = true, features = ["js"] }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlDivElement",
    "KeyboardEvent", "MouseEvent", "PointerEvent", "WheelEvent", "Event", "EventTarget", "FocusEvent",
    "MediaQueryList", "MediaQueryListEvent", "DomRect", "CssStyleDeclaration", "Location", "UrlSearchParams",
    "Navigator", "DomTokenList", "ScrollToOptions", "ScrollBehavior", "AddEventListenerOptions", "Performance",
    "HtmlCollection", "Node", "NodeList", "FocusOptions", "HtmlHeadElement", "SubmitEvent", "InputEvent",
] }
serde = { workspace = true }
jiff = { workspace = true, features = ["js"] }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[lints]
workspace = true
