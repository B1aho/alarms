[package]
name = "login"
description = "Open at Login (LoginItem port): SMAppService / systemd --user / Task Scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
app = { workspace = true }
domain = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSBundle"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
