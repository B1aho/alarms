[package]
name = "audio-rodio"
description = "Audio adapter: synthesised built-in sounds, user files (symphonia + libopus), ramp and fades over rodio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
app = { workspace = true }
domain = { workspace = true }
log = { workspace = true }
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "wav", "pcm", "ogg", "vorbis", "flac", "mkv", "adpcm"] }
audiopus = "0.2"
# Link libopus statically (found via pkg-config, else built from the bundled source).
audiopus_sys = { version = "0.1.8", features = ["static"] }

[lints]
workspace = true
